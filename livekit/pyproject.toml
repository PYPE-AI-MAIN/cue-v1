[project]
name = "cue-livekit"
version = "0.1.0"
description = "Cue v1 as a LiveKit Agents turn detector, with Smart Turn v3.2 and Cue's barge-in decision"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# cue-turn is the client in this repo's root (not on PyPI): install it from the clone or the git URL (README.md)
dependencies = ["cue-turn", "livekit-agents[silero]>=1.7.1,<1.9", "numpy", "onnxruntime", "huggingface_hub"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Model = "https://huggingface.co/Pype/cue-v1"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cue_livekit"]

# the repo's prompts ship inside this package's wheel, so prompt() finds them without a clone
[tool.hatch.build.targets.wheel.force-include]
"../prompts" = "cue_livekit/prompts"
