[project]
name = "cue-turn"
version = "1.1.0"
description = "Cue v1: turn detection for voice agents. Downloads the model from Hugging Face, serves it, and asks it when a caller is done."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "huggingface_hub>=0.23"]

[project.optional-dependencies]
# Smart Turn v3.2 on the caller's audio (cue.smart_turn): the benchmarked recipe, p(done) x sqrt(Smart Turn)
voice = ["numpy", "onnxruntime"]
test = ["pytest"]

[project.scripts]
cue = "cue.cli:main"

[project.urls]
Model = "https://huggingface.co/Pype/cue-v1"
Source = "https://github.com/PYPE-AI-MAIN/cue-v1"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cue"]

[tool.pytest.ini_options]
# the core package's tests; the LiveKit integration's: pytest livekit-integration/tests
testpaths = ["tests"]
