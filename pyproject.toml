[project]
name = "cue-turn"
version = "1.0.0"
description = "Cue v1: turn detection for voice agents by a fine-tuned decision model (Gemma 4 E4B)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
eval = ["pandas", "pyarrow", "huggingface_hub", "python-dotenv", "matplotlib"]
train = ["unsloth", "trl", "datasets"]
# CueTurnDetector (cue.livekit) and Smart Turn v3.2 on CPU (cue.smart_turn); see LIVEKIT.md
livekit = ["livekit-agents[silero]>=1.8.1,<1.9", "numpy", "onnxruntime", "huggingface_hub"]
test = ["pytest"]

[project.urls]
Model = "https://huggingface.co/Pype/cue-v1"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cue"]

# the prompts ship inside the package too, so cue.livekit.prompt() finds them in an installed wheel
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "cue/prompts"
